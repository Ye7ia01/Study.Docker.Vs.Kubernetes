# Config Map does not necessarily be env variables
# Configmap + volume = file name as key and content as value
apiVersion: v1
kind: ConfigMap
metadata:
  name: database-init
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS todos (
    id SERIAL PRIMARY KEY,
    text VARCHAR(255) NOT NULL,
    completed BOOLEAN DEFAULT false
    );

    INSERT INTO todos (text, completed) VALUES
    ('Learn Docker basics', true),
    ('Practice docker-compose networking', false),
    ('Deploy the same app on Kubernetes', false),
    ('Understand Services vs Deployments', false);
