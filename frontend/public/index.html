<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3-Tier Todo App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Todo List</h1>
    <p class="subtitle">frontend &rarr; backend &rarr; database</p>
    <div id="status" class="status">Checking backend...</div>

    <form id="todo-form">
      <input id="todo-input" type="text" placeholder="Add a todo..." autocomplete="off">
      <button type="submit">Add</button>
    </form>

    <ul id="todo-list"></ul>
  </div>
  <script src="app.js"></script>
</body>
</html>
